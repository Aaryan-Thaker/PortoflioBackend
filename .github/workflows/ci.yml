name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Run pytest
        env:
          FLASK_ENV: testing
          FLASK_SECRET_KEY: ci-test-secret-key-32-chars-long
          GOOGLE_CLIENT_ID: ci-test-google-client-id.apps.googleusercontent.com
          ALLOWED_ORIGINS: http://localhost:3000,https://turiya-portfolio-platform.vercel.app
        run: |
          pytest -v

